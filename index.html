<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7fb5dc">
<meta name="robots" content="noindex">
<title>400 km</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&display=swap">
<style>
  :root{
    --paper:#fbf4e4; --ink:#2b2a33; --soft:#6d6658; --red:#d9483b; --line:#e0d4bb;
    --hand:'Caveat','Bradley Hand','Segoe Script',cursive;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#20242e;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none}
  #stage{position:relative;width:100%;max-width:520px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden;touch-action:none;background:#7fb5dc}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* HUD */
  #hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:none;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(20,30,50,.45)}
  #hud .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  #left{font:600 19px/1.1 var(--serif)}
  #left small{display:block;font:500 12px/1.3 var(--sans);opacity:.92}
  #right{display:flex;align-items:center;gap:10px}
  #kisses{font:700 22px/1 var(--sans);font-variant-numeric:tabular-nums}
  #kisses span{color:#ffd9d3}
  #mute{pointer-events:auto;width:44px;height:44px;border:0;border-radius:50%;background:rgba(20,30,50,.28);color:#fff;font-size:18px;cursor:pointer}
  #bar{height:5px;margin-top:8px;border-radius:3px;background:rgba(255,255,255,.35);overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}

  /* Pantallas */
  .screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 20px);touch-action:manipulation}
  .screen.on{display:flex}
  .btn{display:block;width:100%;min-height:52px;border:0;border-radius:14px;background:var(--red);color:#fff;font:700 17px/1.2 var(--sans);cursor:pointer;text-decoration:none;text-align:center;padding:16px}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}

  /* Portada */
  #intro{align-items:flex-start;padding-top:calc(env(safe-area-inset-top) + 8vh)}
  #intro .inner{width:100%;text-align:center;color:#1d2a48}
  #intro .para{font:700 28px/1 var(--hand)}
  #intro h1{font:600 clamp(68px,22vw,104px)/1 var(--serif);letter-spacing:-.03em;margin:6px 0 10px}
  #intro p{font:500 18px/1.35 var(--serif);font-style:italic;max-width:19em;margin:0 auto}
  #intro .foot{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px)}
  #intro .how{color:#2b2a33;font:500 14px/1.4 var(--sans);text-align:center;margin-bottom:12px}

  /* Postal */
  #card{background:rgba(25,32,48,.32)}
  .postal{position:relative;width:100%;max-width:370px;background:var(--paper);border-radius:6px;padding:20px 20px 16px;box-shadow:0 18px 44px rgba(15,20,35,.38);transform:rotate(-1.4deg);animation:drop .38s cubic-bezier(.2,1.3,.5,1)}
  @keyframes drop{from{transform:translateY(26px) rotate(3deg);opacity:0}}
  .postal .sello{position:absolute;right:16px;top:16px;width:50px;height:60px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;outline:3px dotted var(--paper);outline-offset:-1px;transform:rotate(3deg)}
  .postal .kicker{font:600 11px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
  .postal h2{font:600 26px/1.1 var(--serif);margin:7px 66px 14px 0;letter-spacing:-.01em}
  .postal p{font:500 26px/1.18 var(--hand);min-height:3.5em}
  .postal .tap{margin-top:12px;font:500 13px/1 var(--sans);color:var(--soft);text-align:right;opacity:0;transition:opacity .25s}
  .postal.ready .tap{opacity:1}

  /* Final */
  #end{align-items:flex-start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:rgba(25,28,48,.42)}
  #end .wrap{width:100%;max-width:380px;margin:auto;animation:drop .5s ease-out}
  #end .carta{color:#fff;margin-bottom:18px;text-shadow:0 1px 6px rgba(15,20,40,.55)}
  #end h2{font:600 34px/1.05 var(--serif);margin-bottom:10px}
  #end .carta p{font:500 26px/1.16 var(--hand)}
  #end .carta .firma{text-align:right;margin-top:8px;font-weight:700}
  .vale{position:relative;background:var(--paper);border-radius:12px;padding:20px 20px 18px;text-align:center;box-shadow:0 18px 44px rgba(15,20,35,.4)}
  .vale .kicker{font:600 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
  .vale .n{font:600 84px/1 var(--serif);color:var(--red);letter-spacing:-.03em;margin:8px 0 0;font-variant-numeric:tabular-nums}
  .vale .q{font:600 24px/1.1 var(--serif);margin-bottom:12px}
  .vale hr{border:0;border-top:2px dashed var(--line);margin:14px -20px}
  .vale .when{font:700 25px/1.1 var(--hand)}
  .vale small{display:block;margin-top:10px;font:400 12px/1.45 var(--sans);color:var(--soft)}
  .acts{margin-top:14px;display:grid;gap:10px}
  .acts .ghost{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
  @media (prefers-reduced-motion:reduce){.postal,#end .wrap{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="row">
      <div id="left"><small>Faltan</small><b id="km">400 km</b></div>
      <div id="right">
        <div id="kisses" aria-label="Besos"><span>♥</span> <b id="kn">0</b></div>
        <button id="mute" aria-label="Quitar el sonido">♪</button>
      </div>
    </div>
    <div id="bar"><i id="fill"></i></div>
  </div>

  <div id="intro" class="screen on">
    <div class="inner">
      <div class="para" id="para">Para ti</div>
      <h1>400 km</h1>
      <p>Es lo que hay entre tú y yo.<br>Hoy conduces tú.</p>
    </div>
    <div class="foot">
      <div class="how">Toca la pantalla para saltar (sí, este coche salta).<br>Cada ♥ es un beso que te debo.</div>
      <button class="btn" id="go">Arrancar</button>
    </div>
  </div>

  <div id="card" class="screen">
    <div class="postal" id="postal">
      <div class="sello">♥</div>
      <div class="kicker">Postal desde</div>
      <h2 id="pTitle"></h2>
      <p id="pText"></p>
      <div class="tap">Toca para seguir →</div>
    </div>
  </div>

  <div id="end" class="screen">
    <div class="wrap">
      <div class="carta">
        <h2>Has llegado.</h2>
        <p id="letter"></p>
        <p class="firma" id="firma"></p>
      </div>
      <div class="vale">
        <div class="kicker">Vale canjeable en persona</div>
        <div class="n" id="vN">0</div>
        <div class="q">besos</div>
        <hr>
        <div class="when" id="vWhen"></div>
        <small id="vFine"></small>
      </div>
      <div class="acts">
        <a class="btn" id="claim" target="_blank" rel="noopener">Reclamar por WhatsApp</a>
        <button class="btn ghost" id="again">Volver a conducir</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============  TODO LO PERSONAL ESTÁ AQUÍ  ============ */
const CONFIG = {
  ella: 'Elenita',     // su nombre o mote; vacío = "Para ti"
  yo: '',              // tu firma; vacío = sin firma
  fecha: '2026-11-14T11:00', // para la cuenta atrás; null = "la semana que viene"
  cita: 'el sábado a las 11',
  whatsapp: '',        // tu número con prefijo; vacío = elige contacto
  carta: 'Cuatrocientos kilómetros en dos minutos. Ojalá fuera siempre así de fácil, Elenita. Como no lo es, el sábado los hago yo de verdad. A las 11 estoy ahí.',
  postales: [
    { km: 90,  lugar: 'Somosierra', txt: 'Madrid ya solo se ve por el retrovisor. Tiene de todo, menos lo único que le falta: tú.' },
    { km: 160, lugar: 'Aranda de Duero', txt: 'Huele a lechazo. No paro. Bueno, cinco minutos. Que no, que sigo. Esto es lo más romántico que he hecho nunca.' },
    { km: 240, lugar: 'Burgos', txt: 'Hace un frío que no es normal. Aunque el peor lo conozco: el de la cama cuando tú estás a 400 km.' },
    { km: 305, lugar: 'Aguilar de Campoo', txt: 'Aquí el aire huele a galletas, de verdad. Te iba a guardar una, pero me la he comido. Te debo otra.' },
    { km: 335, lugar: 'Reinosa', txt: 'Niebla. No se ve absolutamente nada. Da igual, sé perfectamente hacia dónde voy.' },
    { km: 368, lugar: 'Cantabria', txt: 'Verde, vacas y sirimiri. Aquí me van a llamar madrileño. Lo acepto: por ti aguanto lo que sea.' },
  ],
};
/* ====================================================== */

const $ = id => document.getElementById(id);
const stage = $('stage'), cv = $('c'), ctx = cv.getContext('2d');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOTAL = 400;
// iPhones anteriores a iOS 16 no tienen roundRect
if (!ctx.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h) { this.rect(x, y, w, h); };

let W = 0, H = 0, u = 1, GY = 0, BY = 0, ppk = 60, carX = 0;
function resize() {
  const r = stage.getBoundingClientRect();
  W = r.width; H = r.height;
  const d = Math.min(devicePixelRatio || 1, 2);
  cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
  u = Math.min(W / 390, H / 700);
  GY = H * 0.68; BY = GY + 62 * u;
  ppk = 61 * u; carX = W * 0.24;
}
addEventListener('resize', resize); resize();

/* ---------- paisaje por kilómetro ---------- */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const KEYS = [
  { k: 0,   t: '#7fb5dc', b: '#fbe3c4', f: '#a9b3bf', n: '#c9a86a', g: '#d8bd84', fh: 40,  nh: 18 },
  { k: 90,  t: '#6a9fcb', b: '#dcebee', f: '#6c84a0', n: '#7b8c6a', g: '#a8a673', fh: 125, nh: 42 },
  { k: 160, t: '#83b4d8', b: '#f6e2b7', f: '#c4a970', n: '#b58d4f', g: '#d1ad6b', fh: 34,  nh: 18 },
  { k: 240, t: '#8da4b8', b: '#d9dee0', f: '#9aa7ae', n: '#a89f86', g: '#c6bda5', fh: 42,  nh: 20 },
  { k: 325, t: '#7a8a95', b: '#c3cdcc', f: '#70858a', n: '#5d7f63', g: '#7c9a6f', fh: 110, nh: 46 },
  { k: 372, t: '#6d8a9d', b: '#c9d6c7', f: '#4f7f6b', n: '#3f8a55', g: '#5da264', fh: 95,  nh: 42 },
  { k: 400, t: '#4a5f94', b: '#f7b27a', f: '#2f6a68', n: '#2f7a50', g: '#4c8f58', fh: 0,   nh: 0 },
].map(o => ({ ...o, T: hex(o.t), B: hex(o.b), F: hex(o.f), N: hex(o.n), G: hex(o.g) }));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
function env(k) {
  let i = 0; while (i < KEYS.length - 2 && k > KEYS[i + 1].k) i++;
  const A = KEYS[i], B = KEYS[i + 1];
  let t = Math.min(1, Math.max(0, (k - A.k) / (B.k - A.k))); t = t * t * (3 - 2 * t);
  return { t: mix(A.T, B.T, t), b: mix(A.B, B.B, t), f: mix(A.F, B.F, t), n: mix(A.N, B.N, t), g: mix(A.G, B.G, t), fh: A.fh + (B.fh - A.fh) * t, nh: A.nh + (B.nh - A.nh) * t };
}
const hash = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

/* ---------- estado ---------- */
const POST = CONFIG.postales;
let G;
function fresh() {
  return { state: 'intro', km: 0, y: 0, vy: 0, kisses: 0, fines: 0, inv: 0, slow: 0, shake: 0, flash: 0, t: 0,
    ents: [], parts: [], floats: [], next: 9, pIdx: 0, buffer: 0, cookie: false, hinted: false, endT: 0, cardAt: 0 };
}
G = fresh();
const dbg = /km=(\d+)/.exec(location.hash);

/* ---------- sonido ---------- */
let ac = null, muted = false;
function audio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ac && ac.state === 'suspended') ac.resume(); }
function tone(f, d = .1, type = 'sine', v = .06, slide = 0, delay = 0) {
  if (!ac || muted) return;
  const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(f * slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
const buzz = ms => { try { if (!muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} };

/* ---------- aparición de cosas ---------- */
const SAY = { cone: 'Perdón, señor cono', sheep: '¡Beee!', cow: '¡Muuu!', ice: '¡Patinazo!', puddle: '¡Sirimiri!', radar: '¡Flash! Multa: 1 beso' };
const SIZE = { cone: [26, 36], sheep: [50, 40], cow: [70, 52], ice: [62, 8], puddle: [62, 8], radar: [26, 44] };
const pick = a => a[Math.floor(Math.random() * a.length)];
function kind(k) {
  if (k < 60) return 'cone';
  if (k < 130) return pick(['cone', 'cone', 'radar']);
  if (k < 225) return pick(['sheep', 'sheep', 'radar']);
  if (k < 300) return pick(['ice', 'sheep', 'ice']);
  if (k < 350) return pick(['sheep', 'radar', 'ice']);
  return pick(['cow', 'puddle', 'cow']);
}
const heart = (k, h) => G.ents.push({ type: 'heart', km: k, h });
function spawn() {
  const k = G.next;
  if (k > 391) return;
  const r = Math.random();
  if (k < 14) { for (let i = 0; i < 4; i++) heart(k + i, 26); G.next = k + 8; return; }
  if (!G.hinted) { G.hinted = true; G.ents.push({ type: 'cone', km: k + 2, hint: true }); [68, 118, 68].forEach((h, i) => heart(k + 1 + i, h)); G.next = k + 9; return; }
  if (r < .45) { G.ents.push({ type: kind(k), km: k + 1 }); [68, 118, 68].forEach((h, i) => heart(k + i, h)); }
  else if (r < .65) { for (let i = 0; i < 4; i++) heart(k + i, 26); }
  else if (r < .85) { [92, 118, 92].forEach((h, i) => heart(k + i, h)); }
  else G.ents.push({ type: kind(k), km: k });
  G.next = k + 5.5 + Math.random() * 3.5;
}
function say(txt, col = '#fff') { G.floats.push({ txt, col, x: carX + 10 * u, y: BY - G.y - 66 * u, life: 1.3, max: 1.3 }); }
function burst(x, y, n, col = '#ff6b5e') {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, s = (40 + Math.random() * 120) * u;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40 * u, life: .7, max: .7, r: (4 + Math.random() * 5) * u, col, g: 240 * u });
  }
}

/* ---------- control ---------- */
function jump() { if (G.state !== 'play') return; if (G.y <= 0.5) doJump(); else G.buffer = .14; }
function doJump() { G.vy = 760 * u; G.y = 1; G.buffer = 0; tone(330, .13, 'triangle', .05, 1.9); }
stage.addEventListener('pointerdown', e => {
  if (G.state === 'play' && !e.target.closest('#mute')) { e.preventDefault(); jump(); }
  else if (G.state === 'card' && performance.now() - G.cardAt > 700) closeCard();
});
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); if (G.state === 'card') { if (performance.now() - G.cardAt > 700) closeCard(); } else jump(); } });
$('go').onclick = () => { audio(); start(); };
$('again').onclick = () => { $('end').classList.remove('on'); start(); };
$('mute').onclick = e => { e.stopPropagation(); muted = !muted; $('mute').textContent = muted ? '×' : '♪'; $('mute').setAttribute('aria-label', muted ? 'Poner el sonido' : 'Quitar el sonido'); };
function start() {
  G = fresh(); G.state = 'play';
  if (dbg) { G.km = +dbg[1]; G.next = G.km + 8; G.hinted = true; while (G.pIdx < POST.length && POST[G.pIdx].km <= G.km) G.pIdx++; }
  $('intro').classList.remove('on'); $('hud').style.display = 'block';
  $('kn').textContent = '0'; tone(196, .22, 'sawtooth', .025, 1.5);
}

/* ---------- postales ---------- */
function openCard(p) {
  G.state = 'card'; G.cardAt = performance.now();
  $('pTitle').textContent = p.lugar; $('pText').textContent = p.txt;
  const el = $('postal'); el.classList.remove('ready');
  el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  $('card').classList.add('on');
  tone(660, .1, 'sine', .04); tone(880, .14, 'sine', .04, 1, .09);
  setTimeout(() => el.classList.add('ready'), 700);
}
function closeCard() { $('card').classList.remove('on'); G.state = 'play'; G.inv = Math.max(G.inv, 1.1); }

/* ---------- final ---------- */
function plural(n, s, p) { return n + ' ' + (n === 1 ? s : p); }
function whenText() {
  if (!CONFIG.fecha) return 'Válido la semana que viene';
  const ms = new Date(CONFIG.fecha) - Date.now();
  if (!(ms > 0)) return 'Válido desde ya';
  const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
  if (d === 0 && h === 0) return 'Válido dentro de nada';
  return 'Válido ' + CONFIG.cita + '. Faltan ' + (d ? plural(d, 'día', 'días') + (h ? ' y ' : '') : '') + (h ? plural(h, 'hora', 'horas') : '') + '.';
}
function finish() {
  G.state = 'end';
  const regalo = G.kisses < 10, n = Math.max(G.kisses, 10);
  $('hud').style.display = 'none';
  $('letter').textContent = CONFIG.carta;
  $('firma').textContent = CONFIG.yo ? '— ' + CONFIG.yo : '';
  $('vN').textContent = n;
  $('vWhen').textContent = whenText();
  const multas = G.fines === 0 ? 'Sin multas: conduces mejor que yo.' : `Incluye ${plural(G.fines, 'multa cobrada', 'multas cobradas')} en besos.`;
  $('vFine').textContent = (regalo ? 'Has conducido fatal, así que te regalo hasta 10. ' : '') + multas + ' No caduca. No acumulable con excusas. Se pagan al contado, sin prisa.';
  const msg = `Ya he llegado a Santander con ${n} besos en el vale. Ven a pagar.`;
  $('claim').href = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}`;
  $('end').scrollTop = 0; $('end').classList.add('on');
}

/* ---------- lógica ---------- */
const figX = () => carX + 92 * u + (TOTAL - G.km) * ppk;
function update(dt) {
  G.t += dt;
  if (G.state === 'arrived') {
    G.endT += dt;
    if (Math.random() < dt * 9) burst(carX + 46 * u + Math.random() * 60 * u, BY - 60 * u - Math.random() * 50 * u, 1);
    if (G.endT > 2.1) finish();
  }
  if (G.state === 'end') { if (Math.random() < dt * 3) burst(Math.random() * W, GY * Math.random(), 1); }
  if (G.state === 'play') {
    let rate = 4.3 * (1 + .18 * G.km / TOTAL);
    if (G.slow > 0) { G.slow -= dt; rate *= .68; }
    if (G.km > 395) rate *= clamp((TOTAL - G.km) / 5, .07, 1);
    G.km = Math.min(TOTAL, G.km + rate * dt);
    if (G.inv > 0) G.inv -= dt;

    // salto
    if (G.y > 0 || G.vy > 0) {
      G.vy -= 2200 * u * dt; G.y += G.vy * dt;
      if (G.y <= 0) { G.y = 0; G.vy = 0; if (G.buffer > 0) doJump(); }
    }
    if (G.buffer > 0) G.buffer -= dt;

    // aparición
    const reach = G.km + (W - carX) / ppk + 3;
    while (G.next < reach && G.next <= 391) spawn();
    if (!G.cookie && G.km > 285) { G.cookie = true; G.ents.push({ type: 'cookie', km: 301, h: 96 }); }

    // choques
    for (const e of G.ents) {
      const dx = (e.km - G.km) * ppk;
      if (e.type === 'heart' || e.type === 'cookie') {
        const dy = (e.h * u) - (G.y + 22 * u);
        if (!e.got && Math.hypot(dx, dy) < 40 * u) {
          e.got = true;
          const v = e.type === 'cookie' ? 3 : 1;
          G.kisses += v; $('kn').textContent = G.kisses;
          tone(880 + Math.min(G.kisses, 60) * 6, .09, 'sine', .05, 1.5);

function coche() {

  ctx.beginPath(); ctx.moveTo(-38 * u, -8 * u); ctx.lineTo(-38 * u, -22 * u); ctx.quadraticCurveTo(-36 * u, -28 * u, -28 * u, -29 * u); ctx.lineTo(-20 * u, -30 * u);

/* ---------- bucle ---------- */
let last = performance.now();
